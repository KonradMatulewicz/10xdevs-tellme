name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx}"

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Write local secrets for tests
        working-directory: backend
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .dev.vars
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .dev.vars
          echo "TEST_USER_A_EMAIL=${{ secrets.TEST_USER_A_EMAIL }}" >> .dev.vars
          echo "TEST_USER_A_PASSWORD=${{ secrets.TEST_USER_A_PASSWORD }}" >> .dev.vars
          echo "TEST_USER_B_EMAIL=${{ secrets.TEST_USER_B_EMAIL }}" >> .dev.vars
          echo "TEST_USER_B_PASSWORD=${{ secrets.TEST_USER_B_PASSWORD }}" >> .dev.vars

      - name: Run tests
        working-directory: backend
        run: npm test
